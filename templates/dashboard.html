<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCS - Dashboard</title>
    <link rel="stylesheet" href="/static/luxury.css">
    <style>
        .welcome-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
        .welcome-text h1{font-size:24px;font-weight:600;margin-bottom:4px}
        .welcome-text p{font-size:14px;color:var(--on-surface-variant)}
        .quick-actions{display:flex;gap:12px;flex-wrap:wrap}
        .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
        .stat-card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden}
        .stat-card::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;opacity:0.06;pointer-events:none}
        .stat-card:nth-child(1)::after{background:var(--primary)}
        .stat-card:nth-child(2)::after{background:#16a34a}
        .stat-card:nth-child(3)::after{background:#f59e0b}
        .stat-card:nth-child(4)::after{background:#6750A4}
        .stat-icon{width:40px;height:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
        .stat-icon svg{width:20px;height:20px}
        .stat-icon.purple{background:var(--primary-light);color:var(--primary)}
        .stat-icon.green{background:rgba(22,163,74,0.1);color:#16a34a}
        .stat-icon.amber{background:rgba(245,158,11,0.1);color:#f59e0b}
        .stat-icon.indigo{background:rgba(103,80,164,0.1);color:var(--primary)}
        .stat-label{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--on-surface-variant);margin-bottom:4px}
        .stat-value{font-size:32px;font-weight:700;letter-spacing:-0.02em;color:var(--on-surface)}
        .bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
        .content-card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:28px}
        .content-card h3{font-size:15px;font-weight:600;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--outline-variant);display:flex;align-items:center;gap:8px}
        .content-card h3 svg{width:18px;height:18px;color:var(--primary)}
        .plan-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--outline-variant)}
        .plan-row:last-child{border-bottom:none}
        .plan-label{font-size:13px;color:var(--on-surface-variant)}
        .plan-value{font-size:13px;font-weight:500}
        .code-block{background:var(--inverse-surface);color:var(--inverse-on-surface);padding:16px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;overflow-x:auto;white-space:nowrap;border-radius:var(--radius-md);line-height:1.6}
        .trend-chart{height:160px;display:flex;align-items:flex-end;gap:8px;padding-top:16px}
        .trend-bar{flex:1;background:var(--primary-light);border-radius:var(--radius-sm) var(--radius-sm) 0 0;min-height:8px;transition:height 0.5s cubic-bezier(0.2,0,0,1);position:relative}
        .trend-bar:hover{background:var(--primary)}
        .trend-bar .tip{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--on-surface);background:var(--surface-container);padding:2px 8px;border-radius:var(--radius-sm);white-space:nowrap;display:none}
        .trend-bar:hover .tip{display:block}
        .trend-labels{display:flex;gap:8px;margin-top:8px}
        .trend-labels span{flex:1;text-align:center;font-size:11px;color:var(--on-surface-variant)}
        @media(max-width:768px){
            .stat-grid{grid-template-columns:repeat(2,1fr)}
            .bottom-grid{grid-template-columns:1fr}
            .welcome-bar{flex-direction:column;align-items:flex-start}
        }
        @media(max-width:480px){
            .stat-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <div class="sidebar-dark">
        <div class="sidebar-logo">
            <svg viewBox="0 0 36 36" width="36" height="36">
                <rect width="36" height="36" rx="10" fill="#6750A4"/>
                <path d="M10 18l6 6 10-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>SmartCS</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard?lang=en" class="sidebar-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                Dashboard
            </a>
            <a href="/knowledge?lang=en" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                Knowledge Base
            </a>
            <a href="/agent?lang=en" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                Agent Chat
            </a>
            <a href="/pricing?lang=en" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                Subscription
            </a>
            <a href="javascript:void(0)" class="sidebar-link" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </a>
        </nav>
    </div>
    <div class="page-body">
        <div class="main-content" id="mainContent">
            <p class="loading">Loading...</p>
        </div>
    </div>
    <script>
        function logout() {
            localStorage.removeItem('smartcs_token');
            localStorage.removeItem('smartcs_tenant');
            localStorage.removeItem('smartcs_user');
            window.location.href = '/login?lang=en';
        }

        async function api(path) {
            var token = localStorage.getItem('smartcs_token');
            if (!token) { window.location.href = '/login?lang=en'; return null; }
            var res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.status === 401) { window.location.href = '/login?lang=en'; return null; }
            return res.json();
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        async function init() {
            var token = localStorage.getItem('smartcs_token');
            if (!token) { window.location.href = '/login?lang=en'; return; }

            var userStr = localStorage.getItem('smartcs_user');
            var tenantStr = localStorage.getItem('smartcs_tenant');
            var user = userStr ? JSON.parse(userStr) : {};
            var tenant = tenantStr ? JSON.parse(tenantStr) : {};
            var userName = escapeHtml(user.username || 'User');
            var tenantCode = escapeHtml(tenant.code || '');

            try {
                var result = await api('/api/stats/overview');
                if (!result || result.code !== 200) { document.getElementById('mainContent').innerHTML = '<p class="text-muted">Failed to load data.</p>'; return; }
                var stats = result.data;

                var trendResult = await api('/api/stats/trend');
                var trend = (trendResult && trendResult.code === 200) ? trendResult.data : [];

                render(stats, trend, userName, tenant, tenantCode);
            } catch (e) {
                document.getElementById('mainContent').innerHTML = '<p class="text-muted">Failed to load dashboard data.</p>';
            }
        }

        function render(stats, trend, userName, tenant, tenantCode) {
            var mc = document.getElementById('mainContent');
            var widgetScript = '&lt;script src="' + (window.location.origin) + '/chat-widget.js" data-tenant="' + tenantCode + '"&gt;&lt;\/script&gt;';

            var maxTrend = 1;
            trend.forEach(function(t) { if (t.count > maxTrend) maxTrend = t.count; });

            var trendBarsHtml = '';
            var trendLabelsHtml = '';
            trend.forEach(function(t) {
                var h = Math.max(8, Math.round((t.count / maxTrend) * 140));
                var label = t.date ? t.date.substring(5) : '';
                trendBarsHtml += '<div class="trend-bar" style="height:' + h + 'px"><div class="tip">' + t.count + '</div></div>';
                trendLabelsHtml += '<span>' + label + '</span>';
            });

            if (!trend.length) {
                trendBarsHtml = '<div style="text-align:center;width:100%;color:var(--on-surface-variant);font-size:13px;padding:40px 0">No data yet</div>';
            }

            var planName = (tenant.plan || 'free').charAt(0).toUpperCase() + (tenant.plan || 'free').slice(1);

            mc.innerHTML =
                '<div class="welcome-bar">' +
                    '<div class="welcome-text"><h1>Dashboard</h1><p>Welcome back, ' + userName + '</p></div>' +
                    '<div class="quick-actions">' +
                        '<a href="/knowledge?lang=en" class="btn btn-tonal btn-sm">Manage Knowledge</a>' +
                        '<a href="/agent?lang=en" class="btn btn-outline btn-sm">Agent Chat</a>' +
                    '</div>' +
                '</div>' +
                '<div class="stat-grid">' +
                    '<div class="stat-card">' +
                        '<div class="stat-icon purple"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h18v12H12L7 21v-4H3V5z" transform="scale(0.83)"/></svg></div>' +
                        '<div class="stat-label">Total Conversations</div>' +
                        '<div class="stat-value">' + (stats.total_conversations || 0) + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-icon green"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><polyline points="7,10 9,12 13,8" transform="scale(0.83)"/></svg></div>' +
                        '<div class="stat-label">Today</div>' +
                        '<div class="stat-value">' + (stats.today_conversations || 0) + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-icon amber"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20" transform="scale(0.83)"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" transform="scale(0.83)"/></svg></div>' +
                        '<div class="stat-label">Knowledge Items</div>' +
                        '<div class="stat-value">' + (stats.total_knowledge || 0) + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-icon indigo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="7" r="4" transform="scale(0.83)"/><path d="M3 18c0-4.5 3.2-8 7-8s7 3.5 7 8" transform="scale(0.83)"/></svg></div>' +
                        '<div class="stat-label">Active Chats</div>' +
                        '<div class="stat-value">' + (stats.active_conversations || 0) + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="bottom-grid">' +
                    '<div class="content-card">' +
                        '<h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4,22 10,14 16,18 24,8"/></svg>7-Day Trend</h3>' +
                        '<div class="trend-chart">' + trendBarsHtml + '</div>' +
                        '<div class="trend-labels">' + trendLabelsHtml + '</div>' +
                    '</div>' +
                    '<div class="content-card">' +
                        '<h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 6h18v16H15l-5 4v-4H5V6z"/></svg>Chat Widget Integration</h3>' +
                        '<p style="font-size:13px;color:var(--on-surface-variant);margin-bottom:16px">Add this code to your website to enable the AI chat widget:</p>' +
                        '<div class="code-block">' + widgetScript + '</div>' +
                        '<div style="margin-top:16px">' +
                            '<div class="plan-row"><span class="plan-label">Current Plan</span><span class="badge badge-primary">' + escapeHtml(planName) + '</span></div>' +
                            '<div class="plan-row"><span class="plan-label">Agents</span><span class="plan-value">' + (tenant.max_agents || 1) + '</span></div>' +
                            '<div class="plan-row"><span class="plan-label">Knowledge Limit</span><span class="plan-value">' + (tenant.max_knowledge || 100) + '</span></div>' +
                            '<div class="plan-row"><span class="plan-label">Monthly Chats</span><span class="plan-value">' + (tenant.max_conversations || 500) + '</span></div>' +
                        '</div>' +
                        '<a href="/pricing?lang=en" class="btn btn-outline btn-sm" style="margin-top:16px">Manage Subscription</a>' +
                    '</div>' +
                '</div>';
        }

        init();
    </script>
</body>
</html>
