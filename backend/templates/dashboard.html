<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCS - Dashboard</title>
    <link rel="stylesheet" href="/static/luxury.css">
</head>
<body>
    <div class="sidebar-dark">
        <div class="sidebar-logo">
            <svg viewBox="0 0 36 36" width="36" height="36">
                <rect width="36" height="36" rx="10" fill="#6750A4"/>
                <path d="M10 18l6 6 10-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>SmartCS</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard?lang=en" class="sidebar-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                Dashboard
            </a>
            <a href="/knowledge?lang=en" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                Knowledge Base
            </a>
            <a href="/agent?lang=en" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                Agent Chat
            </a>
            <a href="/pricing?lang=en" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                Subscription
            </a>
            <a href="javascript:void(0)" class="sidebar-link" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </a>
        </nav>
    </div>
    <div class="page-body">
        <div class="main-content" id="mainContent">
            <p class="loading">Loading...</p>
        </div>
    </div>
    <script>
        function logout() {
            localStorage.removeItem('smartcs_token');
            localStorage.removeItem('smartcs_tenant');
            localStorage.removeItem('smartcs_user');
            window.location.href = '/login';
        }

        async function api(path, options) {
            var token = localStorage.getItem('smartcs_token');
            if (!token) {
                window.location.href = '/login';
                return null;
            }
            var headers = { 'Authorization': 'Bearer ' + token };
            if (options && options.headers) {
                Object.assign(headers, options.headers);
            }
            var response = await fetch(path, Object.assign({}, options, { headers: headers }));
            if (response.status === 401) {
                window.location.href = '/login';
                return null;
            }
            return response;
        }

        async function init() {
            var token = localStorage.getItem('smartcs_token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            var tenant = localStorage.getItem('smartcs_tenant');
            var user = localStorage.getItem('smartcs_user');
            var userName = user ? JSON.parse(user).name || '' : '';

            try {
                var res = await api('/api/stats/overview');
                if (!res) return;
                var data = await res.json();
                render(data, userName, tenant);
            } catch (e) {
                document.getElementById('mainContent').innerHTML = '<p class="text-muted">Failed to load dashboard data.</p>';
            }
        }

        function render(data, userName, tenant) {
            var mc = document.getElementById('mainContent');
            var stats = data.stats || {};
            var plan = data.plan || {};
            var widgetScript = '<script src="' + (window.location.origin) + '/widget.js" data-tenant="' + (tenant || '') + '"><\/script>';

            mc.innerHTML =
                '<div class="page-header">' +
                    '<h1 class="page-title">Dashboard</h1>' +
                '</div>' +
                '<p class="display-sm" style="margin-bottom:24px">Welcome back, ' + escapeHtml(userName) + '</p>' +
                '<div class="grid-4">' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Total Conversations</div>' +
                        '<div class="stat-value">' + (stats.total_conversations || 0) + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Today</div>' +
                        '<div class="stat-value">' + (stats.today_conversations || 0) + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Knowledge Items</div>' +
                        '<div class="stat-value">' + (stats.knowledge_items || 0) + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Active Chats</div>' +
                        '<div class="stat-value">' + (stats.active_chats || 0) + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="grid-2" style="margin-top:24px">' +
                    '<div class="content-card">' +
                        '<h3 style="margin:0 0 12px">Chat Widget Integration</h3>' +
                        '<p class="text-sm text-muted" style="margin:0 0 16px">Add this code to your website to enable the AI chat widget:</p>' +
                        '<div class="code-block">' +
                            '<code>' + escapeHtml(widgetScript) + '</code>' +
                        '</div>' +
                    '</div>' +
                    '<div class="content-card">' +
                        '<h3 style="margin:0 0 16px">Plan Details</h3>' +
                        '<div style="display:flex;flex-direction:column;gap:12px">' +
                            '<div style="display:flex;justify-content:space-between;align-items:center">' +
                                '<span class="text-sm text-muted">Plan:</span>' +
                                '<span class="badge badge-primary">' + escapeHtml(plan.name || 'Free') + '</span>' +
                            '</div>' +
                            '<div style="display:flex;justify-content:space-between;align-items:center">' +
                                '<span class="text-sm text-muted">Agents:</span>' +
                                '<span class="text-sm">' + (plan.agents || 0) + '</span>' +
                            '</div>' +
                            '<div style="display:flex;justify-content:space-between;align-items:center">' +
                                '<span class="text-sm text-muted">Knowledge:</span>' +
                                '<span class="text-sm">' + (plan.knowledge_limit || 0) + ' items</span>' +
                            '</div>' +
                            '<div style="display:flex;justify-content:space-between;align-items:center">' +
                                '<span class="text-sm text-muted">Monthly Chats:</span>' +
                                '<span class="text-sm">' + (plan.monthly_chats || 0) + '</span>' +
                            '</div>' +
                            '<a href="/pricing?lang=en" class="btn btn-outline btn-sm" style="align-self:flex-start;margin-top:8px">Manage Subscription</a>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
