<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Knowledge Base - SmartCS</title><link rel="stylesheet" href="/static/luxury.css"></head><body>
<div class="sidebar-dark"><div class="sidebar-logo">SmartCS</div><nav class="sidebar-nav"><a href="/dashboard?lang=en" class="sidebar-link "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9" rx="0"/><rect x="14" y="3" width="7" height="5" rx="0"/><rect x="14" y="12" width="7" height="9" rx="0"/><rect x="3" y="16" width="7" height="5" rx="0"/></svg>Dashboard</a><a href="/knowledge?lang=en" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>Knowledge Base</a><a href="/agent?lang=en" class="sidebar-link "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/></svg>Agent Chat</a><a href="/pricing?lang=en" class="sidebar-link ">Subscription</a><a href="#" onclick="logout()" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</a></nav></div>
<div class="main-content">
  <div class="page-header"><h1 class="page-title">Knowledge Base</h1><button class="btn btn-primary btn-sm" onclick="openAdd()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add FAQ</button></div>
  <div class="toolbar">
    <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="form-input" id="searchInput" placeholder="Search questions or answers..." oninput="debounceLoad()"></div>
    <select class="form-input" id="catFilter" onchange="loadData()"><option value="">All Categories</option></select>
  </div>
  <div class="card" style="padding:0">
    <div class="table-wrap">
      <table class="table"><thead><tr><th>Question</th><th>Category</th><th>Keywords</th><th style="width:80px">Views</th><th style="width:140px">Actions</th></tr></thead>
      <tbody id="tbody"></tbody></table>
    </div>
    <div id="emptyState" style="padding:60px;text-align:center;color:var(--gray-400);display:none"><p class="text-lg">No knowledge items yet</p><p class="text-sm" style="margin-top:8px">Add your first FAQ to start training the AI</p></div>
  </div>
</div>
<div class="modal-overlay" id="modal"><div class="modal-box">
  <div class="modal-header"><h3 class="display-sm" id="modalTitle">Add FAQ</h3><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <input type="hidden" id="editId">
    <div class="form-group"><label class="form-label">Question</label><input type="text" class="form-input" id="qInput" placeholder="Enter the question visitors might ask"></div>
    <div class="form-group"><label class="form-label">Answer</label><textarea class="form-input" id="aInput" rows="4" placeholder="Enter the AI response" style="resize:vertical"></textarea></div>
    <div class="grid-2">
      <div class="form-group"><label class="form-label">Category</label><input type="text" class="form-input" id="cInput" placeholder="e.g. billing, support"></div>
      <div class="form-group"><label class="form-label">Keywords</label><input type="text" class="form-input" id="kInput" placeholder="comma separated"></div>
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveItem()">Save</button></div>
</div></div>
<script>
var token = localStorage.getItem('smartcs_token');
if (!token) { location.href = '/login'; }
function logout() { localStorage.clear(); location.href = '/login'; }
async function api(url, opt) {
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers, {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});
  var res = await fetch(url, opt);
  if (res.status === 401) { localStorage.clear(); location.href = '/login'; return; }
  return res.json();
}
</script>
<script>
var lang='en';
var loadTimer;
function debounceLoad(){clearTimeout(loadTimer);loadTimer=setTimeout(loadData,300);}
async function loadData(){
  var kw=document.getElementById('searchInput').value;
  var cat=document.getElementById('catFilter').value;
  var url='/api/knowledge?keyword='+encodeURIComponent(kw);
  if(cat)url+='&category='+encodeURIComponent(cat);
  var r=await api(url);
  var rows=r.data&&r.data.records?r.data.records:[];
  document.getElementById('tbody').innerHTML=rows.length?rows.map(function(k){
    return '<tr><td title="'+k.question+'">'+k.question+'</td><td><span class="badge badge-outline">'+k.category+'</span></td><td class="text-sm text-muted">'+(k.keywords||'-')+'</td><td>'+k.view_count+'</td><td>'+
      '<button class="btn btn-sm btn-outline" onclick="openEdit('+k.id+',''+k.question.replace(/'/g,"\'")+'',''+(k.category||'').replace(/'/g,"\'")+'',''+(k.keywords||'').replace(/'/g,"\'")+'',''+(k.answer||'').replace(/\n/g,' ').replace(/'/g,"\'")+'')">Edit FAQ</button> '+
      '<button class="btn btn-sm btn-outline" style="color:#dc2626" onclick="deleteItem('+k.id+')">Save</button></td></tr>';
  }).join(''):'';
  var lang=document.getElementById('emptyState')?null:null;
  document.getElementById('emptyState').style.display=rows.length?'none':'block';
  var cats=rows.reduce(function(a,r){if(r.category&&a.indexOf(r.category)<0)a.push(r.category);return a;},[]);
  var sel=document.getElementById('catFilter'),cur=sel.value;
  sel.innerHTML='<option value="">All Categories</option>'+cats.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
  sel.value=cur;
}
function openAdd(){
  document.getElementById('editId').value='';document.getElementById('qInput').value='';
  document.getElementById('aInput').value='';document.getElementById('cInput').value='';
  document.getElementById('kInput').value='';
  document.getElementById('modalTitle').textContent='Add FAQ';
  document.getElementById('modal').classList.add('open');
}
function openEdit(id,q,cat,kw,ans){
  document.getElementById('editId').value=id;document.getElementById('qInput').value=q;
  document.getElementById('aInput').value=ans;document.getElementById('cInput').value=cat;
  document.getElementById('kInput').value=kw;
  document.getElementById('modalTitle').textContent='Edit FAQ';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
async function saveItem(){
  var id=document.getElementById('editId').value;
  var data={question:document.getElementById('qInput').value.trim(),answer:document.getElementById('aInput').value.trim(),category:document.getElementById('cInput').value.trim()||'general',keywords:document.getElementById('kInput').value.trim()};
  if(!data.question||!data.answer){alert('Required');return;}
  if(id){await api('/api/knowledge/'+id,{method:'PUT',body:JSON.stringify(data)});}
  else{await api('/api/knowledge',{method:'POST',body:JSON.stringify(data)});}
  closeModal();loadData();
}
async function deleteItem(id){
  if(!confirm('Delete this FAQ item?'))return;
  await api('/api/knowledge/'+id,{method:'DELETE'});loadData();
}
loadData();
</script>
</body></html>
