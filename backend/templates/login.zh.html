<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 - SmartCS</title>
<link rel="stylesheet" href="/static/luxury.css">
<style>body{background:var(--gray-50)}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.auth-card{background:var(--white);border:1px solid var(--gray-200);width:100%;max-width:440px;padding:56px 48px}
.auth-logo{font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:40px}
.auth-logo a{color:var(--black);text-decoration:none}
.auth-title{font-size:24px;font-weight:600;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--gray-500);margin-bottom:40px}
.auth-link{font-size:13px;color:var(--gray-500);text-align:center;margin-top:32px}
.auth-link a{color:var(--black);font-weight:500;text-decoration:none}
.auth-link a:hover{text-decoration:underline}
.lang-bar{text-align:right;margin-bottom:16px}
.lang-bar a{font-size:11px;color:var(--gray-400);text-decoration:none;margin-left:12px;letter-spacing:0.06em;text-transform:uppercase}
.lang-bar a.active{color:var(--black);font-weight:600}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="lang-bar">
      <a href="/login?lang=en" class="">EN</a>
      <a href="/login?lang=zh" class="active">&#20013;&#25991;</a>
    </div>
    <div class="auth-logo"><a href="/?lang=zh">SmartCS</a></div>
    <h1 class="auth-title">欢迎回来</h1>
    <p class="auth-sub">登录您的工作区</p>
    <div class="msg-box msg-error" id="errorMsg"></div>
    <div class="msg-box msg-success" id="successMsg"></div>
    <form onsubmit="return false;">
      <div class="form-group"><label class="form-label">公司代码</label><input type="text" class="form-input" id="code" placeholder="请输入公司代码" autocomplete="organization"></div>
      <div class="form-group"><label class="form-label">用户名</label><input type="text" class="form-input" id="username" placeholder="admin" autocomplete="username"></div>
      <div class="form-group"><label class="form-label">登录密码</label><input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <button type="button" class="btn btn-primary" style="width:100%;justify-content:center;padding:16px" onclick="doLogin()">登录</button>
    </form>
    <div class="auth-link">还没有账号？ <a href="/register?lang=zh">立即注册</a></div>
  </div>
</div>
<script>
function showError(msg){var el=document.getElementById('errorMsg');el.textContent=msg;el.style.display='block';document.getElementById('successMsg').style.display='none';}
function showSuccess(msg){var el=document.getElementById('successMsg');el.textContent=msg;el.style.display='block';document.getElementById('errorMsg').style.display='none';}
async function doLogin(){
  var code=document.getElementById('code').value.trim();
  var username=document.getElementById('username').value.trim();
  var password=document.getElementById('password').value;
  document.getElementById('errorMsg').style.display='none';
  if(!code||!username||!password){showError('请填写所有字段');return;}
  try{
    var res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,username,password})});
    var data=await res.json();
    if(data.code===200){
      localStorage.setItem('smartcs_token',data.data.token);
      localStorage.setItem('smartcs_tenant',JSON.stringify(data.data.tenant));
      localStorage.setItem('smartcs_user',JSON.stringify(data.data.user));
      showSuccess('OK...');setTimeout(function(){location.href='/dashboard?lang=zh';},300);
    }else{showError(data.message||'登录失败，请检查信息');}
  }catch(e){showError('网络错误，请稍后重试');}
}
document.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
</script>
</body></html>
