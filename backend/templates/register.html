<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account - SmartCS</title>
<link rel="stylesheet" href="/static/luxury.css">
<style>body{background:var(--gray-50)}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.auth-card{background:var(--white);border:1px solid var(--gray-200);width:100%;max-width:440px;padding:56px 48px}
.auth-logo{font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:40px}
.auth-logo a{color:var(--black);text-decoration:none}
.auth-title{font-size:24px;font-weight:600;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--gray-500);margin-bottom:40px}
.auth-link{font-size:13px;color:var(--gray-500);text-align:center;margin-top:32px}
.auth-link a{color:var(--black);font-weight:500;text-decoration:none}
.auth-link a:hover{text-decoration:underline}
.lang-bar{text-align:right;margin-bottom:16px}
.lang-bar a{font-size:11px;color:var(--gray-400);text-decoration:none;margin-left:12px;letter-spacing:0.06em;text-transform:uppercase}
.lang-bar a.active{color:var(--black);font-weight:600}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="lang-bar">
      <a href="/register?lang=en" class="active">EN</a>
      <a href="/register?lang=zh" class="">&#20013;&#25991;</a>
    </div>
    <div class="auth-logo"><a href="/?lang=en">SmartCS</a></div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Start your AI customer service journey</p>
    <div class="msg-box msg-error" id="errorMsg"></div>
    <div class="msg-box msg-success" id="successMsg"></div>
    <form onsubmit="return false;">
      <div class="form-group"><label class="form-label">Company Name</label><input type="text" class="form-input" id="company" placeholder="Acme Corporation"></div>
      <div class="form-group"><label class="form-label">Company Code</label><input type="text" class="form-input" id="code" placeholder="acme" style="text-transform:lowercase"><div class="form-hint">Lowercase letters and numbers only. Used for widget integration.</div></div>
      <div class="form-group"><label class="form-label">Admin Username</label><input type="text" class="form-input" id="username" placeholder="admin"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="email" placeholder="admin@company.com"></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="password" placeholder="Minimum 6 characters"></div>
      <button type="button" class="btn btn-primary" style="width:100%;justify-content:center;padding:16px" onclick="doRegister()">Create Account</button>
    </form>
    <div class="auth-link">Already have an account? <a href="/login?lang=en">Sign in</a></div>
  </div>
</div>
<script>
function showError(msg){var el=document.getElementById('errorMsg');el.textContent=msg;el.style.display='block';document.getElementById('successMsg').style.display='none';}
function showSuccess(msg){var el=document.getElementById('successMsg');el.textContent=msg;el.style.display='block';document.getElementById('errorMsg').style.display='none';}
async function doRegister(){
  var company=document.getElementById('company').value.trim();
  var code=document.getElementById('code').value.trim().toLowerCase();
  var username=document.getElementById('username').value.trim();
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  document.getElementById('errorMsg').style.display='none';
  if(!company||!code||!username||!email||!password){showError('All fields are required');return;}
  if(password.length<6){showError('Password must be at least 6 characters');return;}
  if(!/^[a-z0-9]+$/.test(code)){showError('Company code must be lowercase letters and numbers only');return;}
  try{
    var res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company,code,username,email,password})});
    var data=await res.json();
    if(data.code===200){showSuccess('Account created! Redirecting...');setTimeout(function(){location.href='/login?lang=en';},1500);}
    else{showError(data.message||'Registration failed');}
  }catch(e){showError('Network error, please try again');}
}
</script>
</body></html>
