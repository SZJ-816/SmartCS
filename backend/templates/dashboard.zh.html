<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理面板 - SmartCS</title><link rel="stylesheet" href="/static/luxury.css"></head><body>
<div class="sidebar-dark"><div class="sidebar-logo">SmartCS</div><nav class="sidebar-nav"><a href="/dashboard?lang=zh" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9" rx="0"/><rect x="14" y="3" width="7" height="5" rx="0"/><rect x="14" y="12" width="7" height="9" rx="0"/><rect x="3" y="16" width="7" height="5" rx="0"/></svg>管理面板</a><a href="/knowledge?lang=zh" class="sidebar-link "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>知识库</a><a href="/agent?lang=zh" class="sidebar-link "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/></svg>客服对话</a><a href="/pricing?lang=zh" class="sidebar-link ">订阅管理</a><a href="#" onclick="logout()" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</a></nav></div>
<div class="main-content" id="mainContent"><div class="loading">加载中...</div></div>
<script>
var token = localStorage.getItem('smartcs_token');
if (!token) { location.href = '/login'; }
function logout() { localStorage.clear(); location.href = '/login'; }
async function api(url, opt) {
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers, {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});
  var res = await fetch(url, opt);
  if (res.status === 401) { localStorage.clear(); location.href = '/login'; return; }
  return res.json();
}
</script>
<script>
var tenant = JSON.parse(localStorage.getItem('smartcs_tenant') || '{}');
var user = JSON.parse(localStorage.getItem('smartcs_user') || '{}');
async function init(){
  var r = await api('/api/stats/overview');
  var s = r.data;
  var lang = 'zh';
  document.getElementById('mainContent').innerHTML = 
    '<div class="page-header"><div><h1 class="page-title">管理面板</h1><p class="text-sm text-muted" style="margin-top:4px">欢迎回来，' + (user.username||'') + '</p></div><div class="badge badge-dark">'+(tenant.plan||'free')+'</div></div>'+
    '<div class="grid-4" style="margin-bottom:24px">'+
      '<div class="stat-card"><div class="stat-label">总对话数</div><div class="stat-value">'+(s.total_conversations||0)+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">今日</div><div class="stat-value">'+(s.today_conversations||0)+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">知识条目</div><div class="stat-value">'+(s.total_knowledge||0)+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">活跃对话</div><div class="stat-value">'+(s.active_conversations||0)+'</div></div>'+
    '</div>'+
    '<div class="grid-2">'+
      '<div class="content-card"><h3>聊窗组件集成</h3><p class="text-sm text-muted" style="margin-bottom:16px">将以下代码添加到您的网站即可启用 AI 智能聊窗：</p><div class="code-block">&lt;script src="//'+location.host+'/chat-widget.js" data-tenant="'+(tenant.code||'YOUR_CODE')+'"&gt;&lt;/script&gt;</div></div>'+
      '<div class="content-card"><h3>方案：' + ((tenant.plan||'free').toUpperCase()) + '</h3><p class="text-sm text-muted" style="margin-bottom:16px">坐席: '+(tenant.max_agents||1)+' &middot; 知识: '+(tenant.max_knowledge||100)+' &middot; 月对话: '+(tenant.max_conversations||500)+'</p><a href="/pricing?lang='+lang+'" class="btn btn-outline btn-sm">管理订阅</a></div>'+
    '</div>';
}
init();
</script>
</body></html>
