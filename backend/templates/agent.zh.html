<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>客服对话 - SmartCS</title><link rel="stylesheet" href="/static/luxury.css"><style>.chat-layout{display:grid;grid-template-columns:300px 1fr;gap:24px;height:calc(100vh - 180px)}.conv-list{background:var(--white);border:1px solid var(--gray-200);overflow-y:auto}.conv-list-header{padding:20px 24px;border-bottom:1px solid var(--gray-200);font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-500)}.conv-item{padding:16px 24px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background 0.15s}.conv-item:hover{background:var(--gray-50)}.conv-item.active{background:var(--gray-100);border-left:2px solid var(--black)}.conv-item .visitor{font-size:14px;font-weight:500}.conv-item .meta{font-size:11px;color:var(--gray-400);margin-top:4px;display:flex;justify-content:space-between}.conv-item .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}.status-bot{background:var(--gold)}.status-waiting{background:#f59e0b}.status-agent{background:#22c55e}.status-closed{background:var(--gray-300)}.chat-panel{background:var(--white);border:1px solid var(--gray-200);display:flex;flex-direction:column}.chat-header{padding:20px 24px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}.chat-header h3{font-size:14px;font-weight:600}.chat-messages{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}.chat-msg{max-width:72%;padding:12px 16px;font-size:14px;line-height:1.6}.chat-msg.visitor{background:var(--gray-100);align-self:flex-start}.chat-msg.bot{background:var(--gray-900);color:var(--white);align-self:flex-start}.chat-msg.agent{background:var(--black);color:var(--white);align-self:flex-end}.chat-msg .time{font-size:11px;opacity:0.5;margin-top:6px;display:block}.chat-input-area{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;gap:12px}.chat-input-area input{flex:1}.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--gray-400)}@media(max-width:768px){.chat-layout{grid-template-columns:1fr;height:calc(100vh - 220px)}.conv-list{max-height:200px}}</style></head><body><div class="sidebar-dark"><div class="sidebar-logo">SmartCS</div><nav class="sidebar-nav"><a href="/dashboard?lang=zh" class="sidebar-link "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9" rx="0"/><rect x="14" y="3" width="7" height="5" rx="0"/><rect x="14" y="12" width="7" height="9" rx="0"/><rect x="3" y="16" width="7" height="5" rx="0"/></svg>管理面板</a><a href="/knowledge?lang=zh" class="sidebar-link "><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>知识库</a><a href="/agent?lang=zh" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><line x1="9" y1="10" x2="15" y2="10"/></svg>客服对话</a><a href="/pricing?lang=zh" class="sidebar-link ">订阅管理</a><a href="#" onclick="logout()" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</a></nav></div><div class="main-content">  <div class="page-header"><h1 class="page-title">客服对话</h1></div>  <div class="chat-layout">    <div class="conv-list" id="convList">      <div class="conv-list-header">对话列表</div>      <div id="convItems"></div>    </div>    <div class="chat-panel">      <div class="chat-header"><h3 id="chatTitle">选择一个对话</h3><div id="chatActions"></div></div>      <div class="chat-messages" id="chatMessages"><div class="empty-chat">请从左侧选择一个对话</div></div>      <div class="chat-input-area">        <input type="text" class="form-input" id="msgInput" placeholder="输入消息..." disabled onkeydown="if(event.key==='Enter')sendMsg()">        <button class="btn btn-primary btn-sm" id="sendBtn" disabled onclick="sendMsg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>发送</button>      </div>    </div>  </div></div><script>
var token=localStorage.getItem('smartcs_token');
if(!token){location.href='/login?lang=zh';}
function logout(){localStorage.clear();location.href='/login?lang=zh';}
async function api(url,opt){
  opt=opt||{};opt.headers=Object.assign({},opt.headers,{'Authorization':'Bearer '+token,'Content-Type':'application/json'});
  var res=await fetch(url,opt);if(res.status===401){localStorage.clear();location.href='/login?lang=zh';return;}return res.json();
}
</script><script>var lang="zh";var currentConv=null;var T={no_conv:"暂无活跃对话",select:"选择一个对话",select_sub:"请从左侧选择一个对话",no_msg:"暂无消息",close:"结束对话",rate:"评价本次对话（1-5分，留空跳过）："};async function loadConvs(){  var r=await api("/api/agent/conversations");var cs=r.data||[];  document.getElementById("convItems").innerHTML=cs.length?cs.map(function(c){    return '<div class="conv-item'+(currentConv===c.id?' active':'')+'" onclick="selectConv('+c.id+')"><div class="visitor"><span class="status-dot status-'+c.status+'"></span>'+c.visitor_name+'</div><div class="meta"><span>'+c.status+'</span><span>'+c.created_at+'</span></div></div>';  }).join(''):'<div style="padding:24px;text-align:center;color:var(--gray-400);font-size:13px">'+T.no_conv+'</div>';}async function selectConv(cid){  currentConv=cid;document.getElementById("msgInput").disabled=false;document.getElementById("sendBtn").disabled=false;  var r=await api("/api/chat/messages/"+cid);var msgs=r.data||[];  document.getElementById("chatTitle").textContent="#"+cid;  document.getElementById("chatActions").innerHTML='<button class="btn btn-sm btn-outline" onclick="closeConv()">'+T.close+'</button>';  document.getElementById("chatMessages").innerHTML=msgs.length?msgs.map(function(m){    return '<div class="chat-msg '+m.sender_type+'">'+m.content.replace(/</g,"&lt;")+'<span class="time">'+m.created_at+'</span></div>';  }).join(''):'<div class="empty-chat">'+T.no_msg+'</div>';  var el=document.getElementById("chatMessages");el.scrollTop=el.scrollHeight;loadConvs();}async function sendMsg(){  if(!currentConv)return;var msg=document.getElementById("msgInput").value.trim();if(!msg)return;  document.getElementById("msgInput").value="";  await api("/api/agent/reply",{method:"POST",body:JSON.stringify({conversation_id:currentConv,message:msg})});  selectConv(currentConv);}async function closeConv(){  if(!currentConv)return;var rating=prompt(T.rate);  await api("/api/agent/close/"+currentConv,{method:"POST",body:JSON.stringify({rating:rating||null})});  currentConv=null;document.getElementById("chatMessages").innerHTML='<div class="empty-chat">'+T.select_sub+'</div>';  document.getElementById("chatTitle").textContent=T.select;document.getElementById("chatActions").innerHTML="";  document.getElementById("msgInput").disabled=true;document.getElementById("sendBtn").disabled=true;loadConvs();}setInterval(loadConvs,5000);loadConvs();</script></body></html>
